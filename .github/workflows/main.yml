name: Test Hong Cung Toi Radar

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "radar.py"
      - "editorial_v82.py"
      - "editorial_pipeline.py"
      - "monetization_preflight.py"
      - "source_reader.py"
      - "build_editorial_context.py"
      - "build_draft_packets.py"
      - "draft_validator.py"
      - "prepare_facebook_queue.py"
      - "test_editorial_v82.py"
      - "test_editorial_pipeline_v82.py"
      - "test_monetization_preflight.py"
      - ".github/workflows/main.yml"

jobs:
  test-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Editorial V8.2 unit tests
        run: python -m unittest test_editorial_v82.py test_editorial_pipeline_v82.py test_monetization_preflight.py

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore radar history
        uses: actions/cache@v4
        with:
          path: radar_history.json
          key: radar-history-${{ github.run_id }}
          restore-keys: |
            radar-history-

      - name: Restore Facebook session
        env:
          FB_STORAGE_STATE_B64: ${{ secrets.FB_STORAGE_STATE_B64 }}
        shell: bash
        run: |
          if [ -n "$FB_STORAGE_STATE_B64" ]; then
            printf '%s' "$FB_STORAGE_STATE_B64" | base64 --decode > fb_storage_state.json
            chmod 600 fb_storage_state.json
            echo "Facebook storage state restored."
          else
            echo "FB_STORAGE_STATE_B64 is not configured; Radar will use anonymous Facebook collection."
          fi

      - name: Run Hong Cung Toi Radar V8
        env:
          FB_STORAGE_STATE_PATH: ${{ github.workspace }}/fb_storage_state.json
        run: python radar.py

      - name: Build editorial queue V8.2
        run: python editorial_pipeline.py

      - name: Read original sources for drafting
        run: python build_editorial_context.py

      - name: Build standardized drafting packets
        run: python build_draft_packets.py

      - name: Upload radar result
        uses: actions/upload-artifact@v4
        with:
          name: radar-result-${{ github.run_id }}
          path: |
            radar_results.json
            radar_news.json
            radar_events.json
            radar_verified.json
            radar_editor_queue.json
            radar_editorial_v82.json
            radar_editorial_context_v82.json
            radar_draft_packets_v82.json
            radar_history.json
          retention-days: 7
