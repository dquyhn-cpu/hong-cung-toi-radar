name: Test Hong Cung Toi Radar

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "radar.py"
      - "editorial_v82.py"
      - "editorial_pipeline.py"
      - ".github/workflows/main.yml"

jobs:
  test-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore radar history
        uses: actions/cache@v4
        with:
          path: radar_history.json
          key: radar-history-${{ github.run_id }}
          restore-keys: |
            radar-history-

      - name: Run Hong Cung Toi Radar V8
        run: python radar.py

      - name: Build editorial queue V8.2
        run: python editorial_pipeline.py

      - name: Upload radar result
        uses: actions/upload-artifact@v4
        with:
          name: radar-result-${{ github.run_id }}
          path: |
            radar_results.json
            radar_news.json
            radar_events.json
            radar_verified.json
            radar_editor_queue.json
            radar_editorial_v82.json
            radar_history.json
          retention-days: 7
