name: Prepare Manual Editorial Review V8.3

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of candidates to show"
        required: true
        default: "5"
        type: string

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore radar history
        uses: actions/cache@v4
        with:
          path: radar_history.json
          key: radar-history-${{ github.run_id }}
          restore-keys: |
            radar-history-

      - name: Run Radar
        run: python radar.py

      - name: Build Editorial V8.2
        run: python editorial_pipeline.py

      - name: Read original sources
        run: python build_editorial_context.py

      - name: Build draft packets
        run: python build_draft_packets.py

      - name: Prepare manual review candidates
        run: |
          python build_manual_review_v83.py \
            --limit "${{ inputs.limit }}"

      - name: Add review summary
        run: cat editorial_review_candidates_v83.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[Editorial Review V8.3] Run ${{ github.run_id }}" \
            --body-file editorial_review_candidates_v83.md

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: manual-editorial-review-${{ github.run_id }}
          path: |
            editorial_review_candidates_v83.md
            editorial_review_candidates_v83.json
            radar_editorial_context_v82.json
            radar_draft_packets_v82.json
          retention-days: 7
