name: Facebook Group Capability Test

on:
  workflow_dispatch:

jobs:
  capability-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check requests
      - name: Read-only Group capability test
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_VERSION: v26.0
          FB_GROUP_IDS: ${{ secrets.FB_GROUP_IDS }}
        run: python facebook_group_capability_test.py
