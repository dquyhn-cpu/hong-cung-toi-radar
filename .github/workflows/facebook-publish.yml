name: Publish Hong Cung Toi Facebook Page

on:
  push:
    branches: [main]
    paths:
      - ".facebook-publish-trigger"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: pip install --disable-pip-version-check requests pillow
      - name: Fast publish locked package
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_VERSION: v26.0
        run: python facebook_publisher_fast.py --queue facebook_publish_queue.json
